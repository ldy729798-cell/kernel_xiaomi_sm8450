name: Build KernelSU-Next with SUSFS for K60 (mondrian)

on:
  workflow_dispatch:
    inputs:
      susfs_version:
        description: 'SUSFS 补丁版本 (默认使用 5.10)'
        required: false
        default: '5.10'
        type: choice
        options:
          - '5.10'
          - '5.15'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: 安装编译依赖
      run: |
        sudo apt update
        sudo apt install -y git make gcc clang lld flex bison bc cpio rsync \
          python3 python3-dev python3-pip libssl-dev libelf-dev \
          build-essential kernel-package libncurses-dev kmod \
          device-tree-compiler gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: 克隆内核源码 (crDroid 官方分支)
      run: |
        git clone --depth 1 -b los https://github.com/crdroidandroid/android_kernel_xiaomi_sm8450
        cd android_kernel_xiaomi_sm8450

    - name: 集成 KernelSU-Next
      run: |
        cd android_kernel_xiaomi_sm8450
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/main/kernel/setup.sh" | bash -

    - name: 克隆 SUSFS 补丁并应用
      run: |
        cd android_kernel_xiaomi_sm8450
        git clone https://gitlab.com/simonpunk/susfs4ksu.git
        # 应用 KernelSU 侧的补丁
        cp susfs4ksu/10_enable_susfs_for_ksu.patch KernelSU/
        cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
        # 应用内核侧的补丁 (5.10 版本)
        patch -p1 < susfs4ksu/50_add_susfs_in_kernel-5.10.patch || true
        # 如果 50 失败，尝试 60
        patch -p1 < susfs4ksu/60_add_susfs_in_kernel-5.10.patch || true

    - name: 配置编译选项 (userdebug 类型)
      run: |
        cd android_kernel_xiaomi_sm8450
        # 根据实际 defconfig 调整，这里使用通用配置
        make ARCH=arm64 vendor/$(grep -r "defconfig" arch/arm64/configs/vendor/ | head -1 | awk -F/ '{print $NF}') || make ARCH=arm64 defconfig
        # 启用 KSU 和 SUSFS
        scripts/config --enable CONFIG_KSU
        scripts/config --enable CONFIG_KSU_SUSFS
        scripts/config --enable CONFIG_KSU_SUSFS_SUS_SU
        # 确保编译类型为 userdebug (避免 Zygote 崩溃)
        scripts/config --set-str CONFIG_LOCALVERSION "-KSU-SUSFS-userdebug"

    - name: 编译内核 (生成 boot.img)
      run: |
        cd android_kernel_xiaomi_sm8450
        make ARCH=arm64 -j$(nproc) bootimage
        # 如果上述失败，尝试标准编译
        if [ ! -f arch/arm64/boot/boot.img ]; then
          make ARCH=arm64 -j$(nproc) Image.gz-dtb
          # 手动打包 boot.img (需要 mkbootimg)
        fi

    - name: 上传编译产物
      uses: actions/upload-artifact@v4
      with:
        name: K60-SUSFS-bootimg
        path: android_kernel_xiaomi_sm8450/arch/arm64/boot/boot.img
